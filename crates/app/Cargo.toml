[package]
name = "crust"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Native Twitch chat client desktop application"
repository.workspace = true
homepage.workspace = true
build = "build.rs"

[[bin]]
name = "crust"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
eframe = { workspace = true }
egui = { workspace = true }
anyhow = { workspace = true }
reqwest = { workspace = true }
image = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
smallvec = { workspace = true }
directories = { workspace = true }
semver = "1"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
crust-core = { workspace = true }
crust-ui = { workspace = true }
crust-twitch = { workspace = true }
crust-kick = { workspace = true }
crust-emotes = { workspace = true }
crust-storage = { workspace = true }
crust-uploader = { workspace = true }
crust-webview = { workspace = true }
libc = { workspace = true }
base64 = "0.22"
url = { workspace = true }
futures-util = { workspace = true }
tokio-tungstenite = { workspace = true }

# Force wayland-data-control feature onto arboard (transitive via egui-winit)
arboard = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }

[build-dependencies]
cc = { workspace = true }
